{% extends 'base.html' %}
{% load static %}

{% block title %}Login - FreelanceCalc{% endblock %}

{% block content %}
    <div class="page-wrapper" id="main-wrapper" data-layout="vertical" data-navbarbg="skin6" data-sidebartype="full"
         data-sidebar-position="fixed" data-header-position="fixed">
        <div class="position-relative overflow-hidden radial-gradient min-vh-100 d-flex align-items-center justify-content-center">
            <div class="d-flex align-items-center justify-content-center w-100">
                <div class="row justify-content-center w-100">
                    <div class="col-md-8 col-lg-6 col-xxl-4">
                        <div class="card shadow-lg border-0">
                            <div class="card-body p-5">
                                <!-- Logo and Title -->
                                <div class="text-center mb-4">
                                    <a href="{% url 'dashboard' %}" class="text-decoration-none">
                                        <img src="{% static 'assets/images/logos/dark-logo.svg' %}" height="60" alt="FreelanceCalc" class="mb-3">
                                    </a>
                                    <h3 class="text-dark mb-1">Welcome Back!</h3>
                                    <p class="text-muted">Sign in to your FreelanceCalc account</p>
                                </div>

                                <!-- Alerts -->
                                {% include 'alerts.html' %}

                                <!-- Login Form -->
                                <form method="post" action="{% url 'login' %}" class="mt-4">
                                    {% csrf_token %}
                                    <div class="mb-4">
                                        <label for="email" class="form-label fw-semibold">Email Address</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-light border-end-0">
                                                <i class="ti ti-mail text-muted"></i>
                                            </span>
                                            <input type="email"
                                                   class="form-control border-start-0 ps-0"
                                                   id="email"
                                                   name="email"
                                                   placeholder="Enter your email"
                                                   required
                                            >
                                        </div>
                                    </div>
                                    
                                    <div class="mb-4">
                                        <label for="password" class="form-label fw-semibold">Password</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-light border-end-0">
                                                <i class="ti ti-lock text-muted"></i>
                                            </span>
                                            <input type="password"
                                                   class="form-control border-start-0 ps-0"
                                                   id="password"
                                                   name="password"
                                                   placeholder="Enter your password"
                                                   required
                                            >
                                        </div>
                                    </div>
                                    
                                    <div class="d-flex align-items-center justify-content-between mb-4">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" id="rememberMe" checked>
                                            <label class="form-check-label text-muted" for="rememberMe">
                                                Remember me
                                            </label>
                                        </div>
                                        <a href="#" class="text-primary fw-semibold text-decoration-none">Forgot Password?</a>
                                    </div>
                                    
                                    <button type="submit" class="btn btn-primary w-100 py-3 fw-semibold mb-4">
                                        <i class="ti ti-login me-2"></i>Sign In
                                    </button>
                                    
                                    <div class="text-center">
                                        <p class="text-muted mb-0">Don't have an account? 
                                            <a href="{% url 'signup' %}" class="text-primary fw-semibold text-decoration-none">Create one</a>
                                        </p>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock content %}
