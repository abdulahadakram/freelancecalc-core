<div class="row">
    <div class="col-xl-3 col-md-6">
        <div class="card">
            <div class="card-body">
                <div class="d-flex align-items-center">
                    <div class="flex-grow-1">
                        <h4 class="mb-0">{{ total_projects }}</h4>
                        <p class="text-muted mb-0">Total Projects</p>
                    </div>
                    <div class="flex-shrink-0">
                        <i class="ti ti-briefcase fs-4 text-primary"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="col-xl-3 col-md-6">
        <div class="card">
            <div class="card-body">
                <div class="d-flex align-items-center">
                    <div class="flex-grow-1">
                        <h4 class="mb-0">{{ active_projects }}</h4>
                        <p class="text-muted mb-0">Active Projects</p>
                    </div>
                    <div class="flex-shrink-0">
                        <i class="ti ti-player-play fs-4 text-warning"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="col-xl-3 col-md-6">
        <div class="card">
            <div class="card-body">
                <div class="d-flex align-items-center">
                    <div class="flex-grow-1">
                        <h4 class="mb-0">{{ completed_projects }}</h4>
                        <p class="text-muted mb-0">Completed</p>
                    </div>
                    <div class="flex-shrink-0">
                        <i class="ti ti-check fs-4 text-success"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="col-xl-3 col-md-6">
        <div class="card">
            <div class="card-body">
                <div class="d-flex align-items-center">
                    <div class="flex-grow-1">
                        <h4 class="mb-0">{{ recent_payments|length }}</h4>
                        <p class="text-muted mb-0">Recent Payments</p>
                    </div>
                    <div class="flex-shrink-0">
                        <i class="ti ti-money fs-4 text-info"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
