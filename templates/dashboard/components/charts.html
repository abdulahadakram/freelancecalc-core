<div class="row">
    <div class="col-xl-8">
        <div class="card">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h4 class="card-title mb-0">
                        Payment Pipeline
                        <i class="ti ti-info-circle text-muted ms-2" 
                           data-bs-toggle="tooltip" 
                           data-bs-placement="top" 
                           title="Shows your monthly revenue trends"></i>
                    </h4>
                    <a href="{% url 'payment_list' %}" class="text-primary text-decoration-none">
                        View Payment Details
                    </a>
                </div>
                <div id="pipeline-chart"></div>
            </div>
        </div>
    </div>
    <div class="col-xl-4">
        <div class="card">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h4 class="card-title mb-0">Project Status</h4>
                    <a href="{% url 'project_list' %}" class="text-primary text-decoration-none">
                        View Project Details
                    </a>
                </div>
                <div id="project-status-chart"></div>
            </div>
        </div>
    </div>
</div>
<div class="row mt-4">
    <div class="col-xl-12">
        <div class="card">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h4 class="card-title mb-0">
                        Revenue vs Expenses vs Growth
                        <i class="ti ti-info-circle text-muted ms-2" 
                           data-bs-toggle="tooltip" 
                           data-bs-placement="top" 
                           title="Shows your revenue, expenses, net profit, and growth targets over time"></i>
                    </h4>
                    <a href="{% url 'goal_list' %}" class="text-primary text-decoration-none">
                        View Goals
                    </a>
                </div>
                <div id="revenue-growth-chart"></div>
            </div>
        </div>
    </div>
</div>
